<section class="login-wrapper">
  <div class="login-card">
    <h1>Iniciar sesión</h1>
    <p class="login-subtitle">Accede a tu panel de control horario.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="tuemail@ejemplo.com" autocomplete="email">

        <p class="field-error" *ngIf="(emailControl?.touched || submitted) && emailControl?.errors?.['required']">
          Debes introducir tu email.
        </p>

        <p class="field-error" *ngIf="(emailControl?.touched || submitted) && emailControl?.errors?.['email']">
          El email no tiene un formato válido.
        </p>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <div class="password-input-wrapper">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Introduce tu contraseña" autocomplete="current-password">

          <button type="button" class="toggle-password-button icon" [class.active]="showPassword"
            (click)="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
            <svg viewBox="0 0 24 24" class="eye-icon" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
        </div>

        <p class="field-error" *ngIf="(passwordControl?.touched || submitted) && passwordControl?.errors?.['required']">
          Debes introducir tu contraseña.
        </p>
      </div>

      <div class="forgot-password-link">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-link">
      ¿No tienes cuenta?
      <a routerLink="/register">Crear cuenta</a>
    </p>

    <p class="privacy-link">
      <a routerLink="/privacy-policy">Consultar política de privacidad</a>
    </p>
  </div>
</section>
