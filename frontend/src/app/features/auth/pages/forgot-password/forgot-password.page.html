<section class="forgot-password-wrapper">
  <div class="forgot-password-card">
    <h1>Recuperar contraseña</h1>
    <p class="forgot-password-subtitle">
      Introduce tu correo y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tuemail@ejemplo.com"
          autocomplete="email"
        >

        <p class="field-error" *ngIf="(emailControl?.touched || submitted) && emailControl?.errors?.['required']">
          Debes introducir tu email.
        </p>

        <p class="field-error" *ngIf="(emailControl?.touched || submitted) && emailControl?.errors?.['email']">
          El email no tiene un formato válido.
        </p>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" [disabled]="forgotPasswordForm.invalid || loading">
        {{ loading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>

    <p class="auth-link">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </p>
  </div>
</section>
